name: TahoCurrency
version: 1.0.0
main: com.taho.currency.TahoCurrency
api-version: '26.1'
author: Taho
description: Earn Taho Coins by killing mobs and spend them in a custom shop.
commands:
  taho:
    description: Check your Taho Coins balance.
    usage: /taho
  tahobaltop:
    description: Open the Taho Coins leaderboard GUI.
    usage: /tahobaltop
  tahoshop:
    description: Open the Taho Coin Shop GUI.
    usage: /tahoshop
  currency:
    description: Admin command for reloading TahoCurrency.
    usage: /currency reload
permissions:
  tahocurrency.admin:
    description: Allows reloading TahoCurrency.
    default: op
